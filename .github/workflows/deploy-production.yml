name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What should be deployed?
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend
      confirm_production_deploy:
        description: Confirm production deploy
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Require explicit production confirmation
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "true" ]; then
            echo "Production deploy was not confirmed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        if: ${{ inputs.scope == 'all' || inputs.scope == 'backend' }}
        run: dotnet restore backend/ZeroPaper.csproj

      - name: Publish backend artifact
        if: ${{ inputs.scope == 'all' || inputs.scope == 'backend' }}
        env:
          # Design-time only: dotnet-ef parses the model but does not open this connection.
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=zeropaper_migrations;User=migrations;Password=migrations
        run: |
          dotnet publish backend/ZeroPaper.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output .codex-deploy/backend-release
          dotnet tool install dotnet-ef \
            --tool-path .codex-deploy/dotnet-tools \
            --version 8.0.22
          .codex-deploy/dotnet-tools/dotnet-ef migrations script \
            20260630043611_AddSalesAgents \
            --idempotent \
            --project backend/ZeroPaper.csproj \
            --startup-project backend/ZeroPaper.csproj \
            --configuration Release \
            --output .codex-deploy/backend-release/zeropaper-migrations.sql
          tar -C .codex-deploy/backend-release -czf .codex-deploy/zeropaper-backend.tar.gz .

      - name: Install frontend dependencies
        if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Build frontend
        if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
        working-directory: frontend
        run: npm run build

      - name: Package frontend artifact
        if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
        run: |
          mkdir -p .codex-deploy/frontend-release/.next/static
          cp -a frontend/.next/standalone/. .codex-deploy/frontend-release/
          cp -a frontend/.next/static/. .codex-deploy/frontend-release/.next/static/
          cp -a frontend/public .codex-deploy/frontend-release/public
          cp frontend/package.json .codex-deploy/frontend-release/package.json
          tar -C .codex-deploy/frontend-release -czf .codex-deploy/zeropaper-frontend.tar.gz .

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_SSH_PRIVATE_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/zeropaper_deploy_key
          chmod 600 ~/.ssh/zeropaper_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload backend artifact
        if: ${{ inputs.scope == 'all' || inputs.scope == 'backend' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          scp -P "$VPS_PORT" -i ~/.ssh/zeropaper_deploy_key \
            .codex-deploy/zeropaper-backend.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/zeropaper-backend-new.tar.gz"

      - name: Upload frontend artifact
        if: ${{ inputs.scope == 'all' || inputs.scope == 'frontend' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          scp -P "$VPS_PORT" -i ~/.ssh/zeropaper_deploy_key \
            .codex-deploy/zeropaper-frontend.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/zeropaper-frontend-new.tar.gz"

      - name: Activate release on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/zeropaper_deploy_key "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SCOPE='${{ inputs.scope }}' bash -s" <<'REMOTE'
          set -euo pipefail

          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP_DIR="/opt/zeropaper/backups/$STAMP"
          mkdir -p "$BACKUP_DIR"

          if [ "$DEPLOY_SCOPE" = "all" ] || [ "$DEPLOY_SCOPE" = "backend" ]; then
            test -f /tmp/zeropaper-backend-new.tar.gz
            cp -a /opt/zeropaper/backend "$BACKUP_DIR/backend"
            rm -rf /tmp/zeropaper-backend-new
            mkdir -p /tmp/zeropaper-backend-new
            tar -xzf /tmp/zeropaper-backend-new.tar.gz -C /tmp/zeropaper-backend-new
            test -s /tmp/zeropaper-backend-new/zeropaper-migrations.sql

            DB_AUTH_FILE="$(mktemp)"
            export DB_AUTH_FILE
            chmod 600 "$DB_AUTH_FILE"
            trap 'rm -f "${DB_AUTH_FILE:-}"' EXIT
            DB_NAME="$(python3 - <<'PYTHON'
          import os

          raw_connection = None
          with open("/etc/zeropaper/backend.env", encoding="utf-8") as source:
              for raw_line in source:
                  line = raw_line.strip()
                  if line.startswith("ConnectionStrings__DefaultConnection="):
                      raw_connection = line.split("=", 1)[1].strip()
                      break

          if not raw_connection:
              raise SystemExit("ConnectionStrings__DefaultConnection was not found")

          parts = {}
          for piece in raw_connection.split(";"):
              if "=" in piece:
                  key, value = piece.split("=", 1)
                  parts[key.strip().lower().replace(" ", "")] = value.strip()

          def get(*keys, default=""):
              return next((parts[key] for key in keys if key in parts), default)

          def quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          with open(os.environ["DB_AUTH_FILE"], "w", encoding="utf-8") as target:
              target.write("[client]\n")
              target.write(f"host={quote(get('server', 'host', default='127.0.0.1'))}\n")
              target.write(f"port={get('port', default='3306')}\n")
              target.write(f"user={quote(get('userid', 'uid', 'user'))}\n")
              target.write(f"password={quote(get('password', 'pwd'))}\n")

          print(get("database", "initialcatalog"))
          PYTHON
          )"
            test -n "$DB_NAME"

            mariadb-dump --defaults-extra-file="$DB_AUTH_FILE" \
              --single-transaction --routines --triggers --events --hex-blob \
              "$DB_NAME" | gzip -1 > "$BACKUP_DIR/database.sql.gz"
            gzip -t "$BACKUP_DIR/database.sql.gz"
            chmod 600 "$BACKUP_DIR/database.sql.gz"

            systemctl stop zeropaper-backend
            if ! mariadb --defaults-extra-file="$DB_AUTH_FILE" "$DB_NAME" \
              < /tmp/zeropaper-backend-new/zeropaper-migrations.sql; then
              echo "Database migration failed; restarting the previous backend release."
              systemctl start zeropaper-backend
              exit 1
            fi
            rm -f "$DB_AUTH_FILE"
            unset DB_AUTH_FILE
            trap - EXIT
            rm -f /tmp/zeropaper-backend-new/zeropaper-migrations.sql
            rm -rf /opt/zeropaper/backend
            mv /tmp/zeropaper-backend-new /opt/zeropaper/backend
            chown -R zeropaper:zeropaper /opt/zeropaper/backend
            chmod +x /opt/zeropaper/backend/ZeroPaper
            systemctl start zeropaper-backend
            rm -f /tmp/zeropaper-backend-new.tar.gz
          fi

          if [ "$DEPLOY_SCOPE" = "all" ] || [ "$DEPLOY_SCOPE" = "frontend" ]; then
            test -f /tmp/zeropaper-frontend-new.tar.gz
            cp -a /opt/zeropaper/frontend "$BACKUP_DIR/frontend"
            rm -rf /tmp/zeropaper-frontend-new
            mkdir -p /tmp/zeropaper-frontend-new
            tar -xzf /tmp/zeropaper-frontend-new.tar.gz -C /tmp/zeropaper-frontend-new

            systemctl stop zeropaper-frontend
            rm -rf /opt/zeropaper/frontend
            mv /tmp/zeropaper-frontend-new /opt/zeropaper/frontend
            chown -R zeropaper:zeropaper /opt/zeropaper/frontend
            systemctl start zeropaper-frontend
            rm -f /tmp/zeropaper-frontend-new.tar.gz
          fi

          systemctl is-active zeropaper-backend
          systemctl is-active zeropaper-frontend

          wait_for_status() {
            local name="$1"
            local url="$2"
            local expected="$3"
            local status="000"

            for attempt in $(seq 1 30); do
              status="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "$name smoke attempt $attempt: $status"

              if [ "$status" = "$expected" ]; then
                return 0
              fi

              sleep 2
            done

            echo "$name smoke failed. Expected $expected, got $status."
            if [ "$name" = "Backend" ]; then
              systemctl status zeropaper-backend --no-pager -l || true
              journalctl -u zeropaper-backend -n 80 --no-pager || true
            else
              systemctl status zeropaper-frontend --no-pager -l || true
              journalctl -u zeropaper-frontend -n 80 --no-pager || true
            fi
            return 1
          }

          wait_for_status "Backend" "http://127.0.0.1:5097/api/workspace/overview" "401"
          wait_for_status "Frontend" "http://127.0.0.1:3000/" "200"
          echo "Backup created at: $BACKUP_DIR"
          REMOTE
